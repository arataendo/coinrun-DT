# 最終 PPO の軌跡だけで学習する DT（熟練者 DT）。モデルと学習の設定は dt.yaml と同じ
data_dir: data/cpu_expert
context_len: 30
n_layer: 4
n_head: 4
n_embd: 128
dropout: 0.1
batch_size: 64
lr: 0.0006
weight_decay: 0.1
warmup_iters: 1000
max_iters: 30000
reward_scale: 0.1
num_workers: 4
eval_every: 5000
eval_episodes: 32
eval_target_return: 10.0
distribution_mode: easy
save_every: 5000
resume: true
out_dir: checkpoints/cpu/dt_expert
log_dir: runs/cpu/dt_expert
log_every: 100
seed: 0
device: cpu
