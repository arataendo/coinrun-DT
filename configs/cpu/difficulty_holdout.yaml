# ホールドアウト検証用（scripts/run_holdout.sh）。重みを選んだ seed 0〜 とは別のステージで評価する
dt_ckpt: checkpoints/cpu/dt/dt_final.pt
ppo_ckpt: checkpoints/cpu/ppo        # ディレクトリなら最新のチェックポイント
level_start: 1000
num_eval_levels: 200
distribution_mode: easy
target_returns: [10.0, 5.0, 0.0]
rollouts_per_level: 16
sample: true
temperature: 1.0
steps_weight: 0.5
reference_source: ppo
ppo_reference_rollouts: 16
model_metric_weights:            # 既定は expert_nll 単体（results/cpu の比較で最良。エントロピーは逆向きだった）
  expert_nll: 1.0
out_dir: runs/cpu/difficulty_holdout
seed: 0
device: cpu
