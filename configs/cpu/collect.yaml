# 学習の各段階のチェックポイントから軌跡を集める（上手い方策と下手な方策を混ぜる）
# 6 チェックポイント × 512 エピソード ≒ 70 万フレーム。DT 学習時のキャッシュが約 9GB になる
ckpt_dir: checkpoints/cpu/ppo
ckpt_steps: [0, 500000, 1000000, 2000000, 4000000, 10000000]
episodes_per_ckpt: 512
num_envs: 64
temperature: 1.0
distribution_mode: easy
num_levels: 0
out_dir: data/cpu
seed: 0
device: cpu
