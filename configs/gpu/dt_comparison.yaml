# 学習データの違う DT の難易度指標を並べて比べる（scripts/run_expert.sh の最後に実行）
runs:
  mixed:                                   # PPO の各段階の軌跡を混ぜた DT（configs/gpu/dt.yaml）
    train: results/gpu/levels.csv
    holdout: results/gpu_holdout/levels.csv
  expert:                                  # 最終 PPO の軌跡だけの DT（configs/gpu/dt_expert.yaml）
    train: results/gpu_expert/levels.csv
    holdout: results/gpu_expert_holdout/levels.csv
out_dir: results/gpu_dt_comparison
