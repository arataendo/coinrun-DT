# 最終 PPO の軌跡だけで学習する DT（熟練者 DT）。モデルと学習の設定は dt.yaml と同じ
data_dir: data/gpu_expert
context_len: 30
n_layer: 6
n_head: 8
n_embd: 128
dropout: 0.1
batch_size: 128
lr: 0.0006
weight_decay: 0.1
warmup_iters: 2000
max_iters: 100000
reward_scale: 0.1
num_workers: 8
eval_every: 5000
eval_episodes: 64
eval_target_return: 10.0
distribution_mode: easy
save_every: 20000
out_dir: checkpoints/gpu/dt_expert
log_dir: runs/gpu/dt_expert
seed: 0
device: auto
