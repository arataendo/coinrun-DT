# PPO（Procgen 論文の標準設定, easy）。GPU サーバ向け
# 参照値用に独立に学習する2本目の PPO（seed だけ変える。DT のデータには使わない）
total_steps: 25000000
num_envs: 64
num_steps: 256
lr: 0.0005
epochs: 3
num_minibatches: 8
gamma: 0.999
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.01
distribution_mode: easy
num_levels: 0            # 0 = ランダムなステージ
save_every_steps: 1000000
out_dir: checkpoints/gpu/ppo_seed1
log_dir: runs/gpu/ppo_seed1
seed: 1
device: auto
