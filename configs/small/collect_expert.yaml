# 最終 PPO（いちばん強い方策）だけで軌跡を集める（熟練者 DT 用。scripts/run_expert.sh）
# エピソード数は、各段階を混ぜた collect.yaml の合計と同じにする
ckpt_dir: checkpoints/small/ppo
ckpt_steps: [100000000]   # いちばん近い = 最後のチェックポイント
episodes_per_ckpt: 48
num_envs: 16
distribution_mode: easy
num_levels: 0
out_dir: data/small_expert
seed: 0
device: auto
